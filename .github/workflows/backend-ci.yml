name: MyGPR CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-test-backend.txt
      - run: python scripts/check_python_compile.py
      - run: python scripts/check_architecture.py
      - run: python scripts/check_schema_catalog.py
      - run: python backend_smoke.py
      - run: python backend_project_smoke.py
      - run: python -m pytest -q

  backend-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 不再参与：钉版 numpy==2.5.1 要求 Python >=3.12，
        # 3.11 环境永远无法完成依赖安装。
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-test-backend.txt
      - run: python -m pytest -q

  gui-linux-offscreen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -r requirements-core.txt -r requirements-gui.txt -r requirements-dev.txt
      - run: QT_QPA_PLATFORM=offscreen python app_qt.py --smoke

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-core.txt -r requirements-gui.txt -r requirements-dev.txt
      - run: python app_qt.py --smoke

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -c "import mygpr; print('import ok')"
      # 包本身不携带 pytest（测试依赖在 -test-backend），契约测试前需单独安装
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/test_version_consistency.py tests/test_spatial_online_basemap_contract.py -q
