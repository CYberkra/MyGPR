name: MyGPR CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTEST_ADDOPTS: --junitxml=output/ci-tests/junit.xml --durations=20

# 同一 PR/分支的连续推送只保留最新 run，取消仍在排队的过时 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # diff-coverage 需要 origin/main 才能算增量；浅克隆会让它静默退化为空转。
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-test-backend.txt
      # 门禁脚本会 import core/mygpr，需要以可编辑方式安装包本身
      - run: python -m pip install -e .
      # 单一入口：清单只在 scripts/run_backend_quality_gate.py 一处维护，
      # 避免「本地过 CI 也过」这类手工同步漂移。--require-diff 让增量覆盖率
      # 在 PR 的浅克隆下也变成显式失败而非静默 PASS。
      # main push 的 HEAD 与 origin/main 相同，没有增量；仍跑全部质量门禁，
      # PR 要求可计算的有效 diff；覆盖范围外的文档/打包变更允许无后端增量。
      - name: Backend quality gate
        run: python scripts/run_backend_quality_gate.py ${{ github.event_name == 'pull_request' && '--require-diff' || '' }}
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: |
            coverage.json
            diff-coverage-report.json
            output/ci-tests/
          if-no-files-found: ignore
          retention-days: 7

  # 3.13 已由上方 backend job 覆盖，矩阵只跑 3.12；
  # 3.11 不参与：钉版 numpy==2.5.1 要求 Python >=3.12。
  backend-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-test-backend.txt
      - run: python -m pytest -q
      - name: Upload Python 3.12 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-python-312-tests
          path: output/ci-tests/
          if-no-files-found: ignore
          retention-days: 7

  gui-linux-offscreen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYGPR_SMOKE_SHOTS_DIR: ${{ github.workspace }}/output/ci-smoke
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -r requirements-core.txt -r requirements-gui.txt -r requirements-dev.txt
      # Qt 6.11 offscreen 在进程退出清理阶段有偶发段错误（exit 139，
      # 冒烟断言全部通过之后才发生；本地 stash 基线同样复现，main 固有
      # 而非回归）。对 139 重试一次：第一次跑已产出全部验收信号。
      - name: GUI smoke (retry once on known Qt-offscreen exit crash)
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen python app_qt.py --smoke && exit 0
          code=$?
          if [ "$code" -eq 139 ]; then
            echo "::warning::known Qt-offscreen exit segfault (139), retrying once"
            QT_QPA_PLATFORM=offscreen python app_qt.py --smoke
          else
            exit "$code"
          fi
      # 含 Qt 的全量测试：GUI 用例只在本 job 与 gui-windows 执行
      - run: python -m pip install -r requirements-test-backend.txt
      - name: Full pytest (retry once on known Qt-offscreen exit crash)
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q -x --tb=short --timeout=120 --timeout-method=thread && exit 0
          code=$?
          if [ "$code" -eq 139 ]; then
            echo "::warning::known Qt-offscreen exit segfault (139), retrying once"
            QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q -x --tb=short --timeout=120 --timeout-method=thread
          else
            exit "$code"
          fi
      - name: Upload Linux GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-linux
          path: |
            output/ci-smoke/
            output/ci-tests/
          if-no-files-found: ignore
          retention-days: 7

  gui-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MYGPR_SMOKE_SHOTS_DIR: ${{ github.workspace }}/output/ci-smoke
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-core.txt -r requirements-gui.txt -r requirements-dev.txt
      - run: python app_qt.py --smoke
      - run: python -m pip install -r requirements-test-backend.txt
      - name: Windows warmup and teardown regression
        run: python -m pytest tests/test_ui_migration_regressions.py::TestMethodsLoadedWarmupRace -q -x --tb=short --timeout=120 --timeout-method=thread --junitxml=output/ci-tests/windows-warmup.xml
      # This class runs above in a fresh Qt process. Exclude only its duplicate
      # execution here; every test remains mandatory across the two stages.
      - name: Full pytest (warmup lifecycle runs in its own process)
        run: python -m pytest tests/ -q -x --tb=short --timeout=120 --timeout-method=thread --deselect=tests/test_ui_migration_regressions.py::TestMethodsLoadedWarmupRace
      - name: Upload Windows GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-windows
          # 与 MYGPR_SMOKE_SHOTS_DIR 使用同一工作区目录，避免依赖系统临时目录或盘符。
          path: |
            output/ci-smoke/
            output/ci-tests/
          if-no-files-found: ignore
          retention-days: 7

  # Temporary root-cause diagnosis; removed after the shared-process regression
  # is fixed. Every sequence starts with a fresh QApplication process.
  windows-native-diagnosis:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-test-backend.txt -r requirements-gui.txt
      - name: Compare short predecessor sequences
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/qt-native-diagnosis | Out-Null
          $module = 'tests/test_ui_migration_regressions.py'
          $content = 'tests/test_ui_content_simplification.py'
          $theme = 'tests/test_theme_switch_performance.py'
          $cases = @(
            @{name='module'; paths=@($module)},
            @{name='content'; paths=@($content,$module)},
            @{name='home'; paths=@("$($content)::test_startup_and_output_panel_drop_repeated_instructions",$module)},
            @{name='processing'; paths=@("$($content)::test_processing_uses_state_text_instead_of_static_tutorials",$module)},
            @{name='interpretation'; paths=@("$($content)::test_interpretation_has_one_session_status_and_one_point_count",$module)},
            @{name='spatial'; paths=@("$($content)::test_spatial_and_jobs_remove_redundant_region_titles",$module)},
            @{name='delivery'; paths=@("$($content)::test_delivery_uses_controls_as_the_primary_affordance",$module)},
            @{name='tree'; paths=@("$($content)::test_project_tree_does_not_repeat_global_project_identity",$module)}
          )
          $failed = $false
          foreach ($case in $cases) {
            Write-Output "[DEBUG-native-qt] sequence=$($case.name)"
            $casePaths = $case.paths
            python -m pytest @casePaths -q -s -x --tb=short --timeout=45 --timeout-method=thread "--junitxml=output/qt-native-diagnosis/$($case.name).xml" 2>&1 | Tee-Object "output/qt-native-diagnosis/$($case.name).log"
            $result = $LASTEXITCODE
            Write-Output "[DEBUG-native-qt] sequence=$($case.name) exit=$result"
            if ($result -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Upload native diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-diagnosis
          path: output/qt-native-diagnosis/
          retention-days: 7

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -c "import mygpr; print('import ok')"
      # 包本身不携带 pytest（测试依赖在 -test-backend），契约测试前需单独安装
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/test_version_consistency.py tests/test_spatial_online_basemap_contract.py -q
      # 发布工件可构建性持续验证
      - run: python -m pip wheel . --no-deps -w dist
      - name: Upload clean-install test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-install-tests
          path: output/ci-tests/
          if-no-files-found: ignore
          retention-days: 7
