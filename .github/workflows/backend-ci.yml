name: MyGPR CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# 同一 PR/分支的连续推送只保留最新 run，取消仍在排队的过时 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-test-backend.txt
      # 门禁脚本会 import core/mygpr，需要以可编辑方式安装包本身
      - run: python -m pip install -e .
      - run: python scripts/check_python_compile.py
      - run: python scripts/check_architecture.py
      - run: python scripts/check_schema_catalog.py
      - run: python -m ruff check .
      - run: python scripts/check_mypy_budget.py
      - run: python scripts/check_debt_budget.py
      - run: python scripts/check_complexity_budget.py
      - run: python scripts/check_release_hygiene.py
      - run: python scripts/check_project_format_compatibility.py
      - run: python backend_smoke.py
      - run: python backend_project_smoke.py
      - run: python -m pytest -q --cov=mygpr --cov=core --cov-report=json:coverage.json
      - run: python scripts/check_coverage_policy.py coverage.json
      - name: Upload coverage evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore

  # 3.13 已由上方 backend job 覆盖，矩阵只跑 3.12；
  # 3.11 不参与：钉版 numpy==2.5.1 要求 Python >=3.12。
  backend-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-test-backend.txt
      - run: python -m pytest -q

  gui-linux-offscreen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -r requirements-core.txt -r requirements-gui.txt -r requirements-dev.txt
      - run: QT_QPA_PLATFORM=offscreen python app_qt.py --smoke
      # 含 Qt 的全量测试：GUI 用例只在本 job 与 gui-windows 执行
      - run: python -m pip install -r requirements-test-backend.txt
      - run: QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q
      - name: Upload smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-linux
          path: /tmp/mygpr_shots/
          if-no-files-found: ignore

  gui-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-core.txt -r requirements-gui.txt -r requirements-dev.txt
      - run: python app_qt.py --smoke
      - run: python -m pip install -r requirements-test-backend.txt
      - run: python -m pytest tests/ -q
      - name: Upload smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-windows
          # app_qt.py 的 SMOKE_SHOTS_DIR 硬编码 '/tmp/mygpr_shots'，
          # Windows 上解析为工作区所在盘符根（runner 工作区在 D: 盘）。
          path: D:/tmp/mygpr_shots/
          if-no-files-found: ignore

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -c "import mygpr; print('import ok')"
      # 包本身不携带 pytest（测试依赖在 -test-backend），契约测试前需单独安装
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/test_version_consistency.py tests/test_spatial_online_basemap_contract.py -q
      # 发布工件可构建性持续验证
      - run: python -m pip wheel . --no-deps -w dist
