name: MyGPR Lightweight CI

on:
  push:
    branches:
      - codex/research-gprmax-autotune
  pull_request:
    branches:
      - codex/research-gprmax-autotune
  workflow_dispatch:

jobs:
  python-smoke:
    name: python-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Linux GUI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest

      - name: Run preflight smoke
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python scripts/preflight_check.py

      - name: Run gprMax and AutoTune tests
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python -m pytest tests -q -k "gprmax or auto_tune or auto_tune_comparison"
