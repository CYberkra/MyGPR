name: MyGPR Windows packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'packaging/windows/build.py'
      - 'packaging/windows/MyGPR.spec'
      - 'packaging/windows/MyGPR.iss'
      - 'packaging/windows/launcher.py'
      - 'packaging/windows/runtime_hook.py'
      - 'packaging/windows/update_tools.py'
      - 'config/windows_updates.json'
      - 'ui/resources/mygpr_logo.png'
      - '.gitignore'
      - 'ui/update_binding.py'
      - 'ui/controllers/update_controller.py'

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows package / ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [release, seed]
    env:
      MYGPR_PACKAGE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
            requirements-windows-build.txt
      - name: Isolate build dependencies
        shell: pwsh
        run: |
          python -m venv output/package-env
          "$pwd/output/package-env/Scripts" >> $env:GITHUB_PATH
      - name: Pin immutable application source
        shell: pwsh
        run: |
          if ($env:MYGPR_PACKAGE_VARIANT -eq 'seed') {
            git switch -c "codex/qa-seed-$env:GITHUB_RUN_ID"
            git config user.name 'MyGPR CI'
            git config user.email 'ci@users.noreply.github.com'
            python -c "from pathlib import Path; v=Path('VERSION').read_text().strip(); q=v+'a1'; p=Path('pyproject.toml'); s=p.read_text(encoding='utf-8'); assert s.count('version = '+chr(34)+v+chr(34)) == 1; p.write_text(s.replace('version = '+chr(34)+v+chr(34), 'version = '+chr(34)+q+chr(34)), encoding='utf-8'); Path('VERSION').write_text(q+'\n', encoding='utf-8')"
            git add VERSION pyproject.toml
            git commit -m 'test: create local-only older application version for update acceptance'
          }
          "MYGPR_PACKAGE_SOURCE=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
      - name: Install exact build environment and application wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows-build.txt
          python -m pip wheel . --no-deps --wheel-dir output/release-wheels
          $wheel = Get-ChildItem output/release-wheels -Filter '*.whl' | Select-Object -First 1
          python -m pip install "$($wheel.FullName)[gui]"
          python -m pip check
      - name: Freeze and build installer
        shell: pwsh
        run: |
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          $buildArgs = @('packaging/windows/build.py', '--source-ref', $env:MYGPR_PACKAGE_SOURCE, '--output', "output/windows-$env:MYGPR_PACKAGE_VARIANT", '--inno', $compiler)
          if ($env:MYGPR_PACKAGE_VARIANT -eq 'seed') {
            $buildArgs += @('--preview-feed', 'https://localhost:18443/appcast.xml')
          }
          python @buildArgs
      - name: Upload complete package and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ matrix.variant }}
          path: |
            output/windows-${{ matrix.variant }}/assets/
            output/windows-${{ matrix.variant }}/build-provenance.json
            output/windows-${{ matrix.variant }}/frozen-build-check.json
          if-no-files-found: error
          retention-days: 7
