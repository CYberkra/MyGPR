max_function_lines = 450

[[migration_exceptions]]
path_prefix = "mygpr/infrastructure/persistence/interpretation_adapter.py"
allowed_local_import_prefixes = ["core"]
owner = "interpretation-backend"
remove_after = "1.1.0"
reason = "Persistence adapter reuses verified project-store serialization."
max_function_lines = 100

[[migration_exceptions]]
path_prefix = "mygpr/infrastructure/persistence/spatial_adapter.py"
allowed_local_import_prefixes = ["core"]
owner = "spatial-backend"
