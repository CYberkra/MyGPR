schema = "mygpr.architecture_policy.v2"

[project_imports]
prefixes = ["mygpr", "core", "PythonModule"]

[layers.domain]
paths = ["mygpr/domain"]
allowed_local_import_prefixes = ["mygpr.domain"]

[layers.application]
paths = ["mygpr/application"]
allowed_local_import_prefixes = ["mygpr.application", "mygpr.domain"]

[layers.infrastructure]
paths = ["mygpr/infrastructure"]
allowed_local_import_prefixes = ["mygpr.infrastructure", "mygpr.application", "mygpr.domain"]

[layers.interfaces]
paths = ["mygpr/interfaces"]
allowed_local_import_prefixes = ["mygpr.interfaces", "mygpr.application", "mygpr.domain", "mygpr.infrastructure"]

[legacy_core]
paths = ["core"]
# 只禁核心的"深层"依赖（infrastructure/application/interfaces）；mygpr.domain 是
# 共享领域内核，过渡期内 core 引用它属于最不坏的方向（methods_registry 经迁移豁免）。
forbidden_import_prefixes = ["PyQt6", "PySide6", "qfluentwidgets", "studio_app", "frontend_sdk", "ui", "compatibility", "mygpr.infrastructure", "mygpr.application", "mygpr.interfaces"]

[layers.ui]
paths = ["ui"]
allowed_local_import_prefixes = ["ui", "mygpr.interfaces"]

[[migration_exceptions]]
path_prefix = "core/methods_registry.py"
allowed_local_import_prefixes = ["mygpr.infrastructure.processing.algorithms.methods"]
owner = "processing-backend"
remove_after = "1.1.0"
reason = "NATIVE_ALGORITHMS 单一事实来源暂以懒加载方式进入 legacy registry；1.1.0 前改端口/延迟注入。"
expiry_action = "warn"

[[migration_exceptions]]
path_prefix = "core/evidence_export.py"
allowed_local_import_prefixes = ["mygpr.domain", "mygpr.infrastructure.processing.native_adapter"]
owner = "processing-backend"
remove_after = "1.1.0"
reason = "证据导出与 UI/cli_batch 共用 native 执行路径（P1-1 步骤 1 收敛）；随 processing_engine 兼容壳化一并复查。"
expiry_action = "warn"

[[migration_exceptions]]
path_prefix = "core/field_processing_bridge.py"
allowed_local_import_prefixes = ["mygpr.domain", "mygpr.infrastructure.processing.native_adapter"]
owner = "processing-backend"
remove_after = "1.1.0"
reason = "数据集级执行桥与证据 manifest 契约保留，内部执行已切 native（P1-1 步骤 2）；1.1.0 前评估随 processing_engine 退役。"
expiry_action = "warn"

[[migration_exceptions]]
path_prefix = "ui/constants.py"
allowed_local_import_prefixes = ["core.app_paths"]
owner = "qt-ui"
remove_after = "1.1.0"
reason = "ui/constants.LOG_DIR 委托 core.app_paths 统一日志根目录，消除 Windows 下 GUI/core 日志分家。"
expiry_action = "warn"

[[migration_exceptions]]
path_prefix = "ui/desktop_backend_facade.py"
allowed_local_import_prefixes = ["core", "mygpr.application", "mygpr.domain"]
owner = "qt-ui"
remove_after = "1.0.0"
reason = "Facade concentrates all ui→core/ui→domain/ui→application imports; other ui/ modules must route through it."
max_function_lines = 100
expiry_action = "warn"

[path_policy]
forbid_sys_path_mutation_under = ["core", "mygpr", "cli_batch.py"]

[ui_reverse_dependency_exceptions]
# GUI/CLI 入口脚本位于依赖图顶端，按设计可 import ui；反向依赖门禁只约束后端层。
# 同理，app_qt.py 作为进程组合根也允许装配 core.observability（结构化日志与
# 全局异常钩子，先于任何 UI 存在）；业务逻辑仍必须经 mygpr.interfaces 后端 API。
paths = ["app_qt.py"]
reason = "GUI 入口 app_qt.py 按设计装配 ui 包（main_window 等）；core/mygpr/PythonModule 仍受禁。"

[new_code_quality]
paths = ["mygpr/domain", "mygpr/application", "mygpr/infrastructure", "mygpr/interfaces"]
max_module_lines = 1000
max_class_lines = 600
max_function_lines = 100
forbid_silent_exception_handlers = true

# 迁移豁免的到期兑现。每条 [[migration_exceptions]] 的 `remove_after` 是一个
# 承诺：遗留路径只是被「借」到那个版本为止。enabled=true 时门禁会比对
# pyproject.toml 的当前 version —— 过期条目不再沉默，必须按 expiry_action 处理：
#   fail         门禁失败（删掉豁免与遗留路径，或带新 expiry_action 重新登记）
#   warn         只报告（用于首次灰度，让门禁先"说话"再"咬人"）
#   extend:<ver> 在记录上延期到 <ver>，且必须 > 原 remove_after
# 缺省是 warn。设 enabled=false 可整体关闭（不建议：等于退回"承诺不兑现"）。
[migration_expiry]
enabled = true

[[migration_exceptions]]
path_prefix = "mygpr/application/autotune"
allowed_local_import_prefixes = []
owner = "autotune"
remove_after = "1.0.0"
reason = "Verified historical AutoTune scoring functions are being decomposed behind application ports."
max_function_lines = 450
expiry_action = "warn"

