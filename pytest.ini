[pytest]
markers =
    unit: fast, headless unit tests for core algorithms and pure helpers.
    gui: tests that instantiate PyQt6/qfluentwidgets UI classes or require a Qt event loop.
    integration: tests that exercise multi-module workflows, CLI paths, evidence generation, or external-like runners.
    slow: tests that may take longer than the default unit-test budget.
    gprmax: tests related to gprMax campaign, conversion, pairing, preview, or benchmark contracts.
    wavelet: tests that require PyWavelets/pywt.
addopts = -ra
testpaths = tests
