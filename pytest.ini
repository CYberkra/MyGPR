[pytest]
markers =
    unit: fast, headless unit tests for pure helpers and core algorithms.
    smoke: fixed production-critical workflow coverage used by merge gates.
    gui: tests that instantiate PyQt6/qfluentwidgets or require a Qt event loop.
    integration: tests that cross module, process, CLI, or artifact boundaries.
    slow: validation or benchmark tests outside the local feedback budget.
    large_data: large-file, mmap, memory, or sustained I/O coverage.
    windows: Windows-specific launcher, DPI, packaging, or platform coverage.
    hardware: tests that require physical GPR, RTK, IMU, GPU, or removable media.
    release: release-contract, version, dependency, and packaging checks.
    release_only: tests intentionally reserved for release-candidate validation.
    gprmax: gprMax campaign, conversion, pairing, preview, or benchmark contracts.
    wavelet: tests requiring PyWavelets/pywt.
    vtk: tests that own VTK/PyVista native process-global state.
    matplotlib: tests that own interactive Matplotlib process-global state.
    jobs: unified Job Manager, cancellation, rollback, and background execution.
    sync: radar, RTK, IMU, flight-height, and trace-metadata synchronization.
    gis: CRS, GIS layers, DEM, map rendering, and spatial export.
    annotation: basal-interface annotation and interpretation workflows.
    reporting: PDF, HTML, Excel, audit, checksum, and formal report output.
    storage: project persistence, schema, mmap, source registry, and artifacts.
    project: project lifecycle, state binding, metadata, and operations.
    processing: processing sessions, chains, lineage, and processing UI.
    io: GPR readers, import/export, format detection, and data interfaces.
    algorithms: numerical processing kernels and compatibility contracts.
    autotune: automatic tuning, scoring, policies, and recommendation workflows.
    motion: UAV motion compensation and trajectory-related processing.
    simulation: gprMax and synthetic-data workflows.
    quality: QC metrics, no-prior guardrails, and data-quality decisions.
    delivery: delivery services, export packages, and field handoff artifacts.
    tooling: developer, CI, release, environment, and repository tooling.
    ui: visual shell, layout, interaction, and UI boundary contracts.
    compatibility: backward compatibility and cross-version seams.
    maintenance: architecture, schema migration, durability, backup, and long-term maintenance contracts.
    observability: structured logs, diagnostic context, support bundles, and operational evidence.
    misc: deliberately uncategorized residual coverage; reviewed by policy checks.
    industrial: industrial acceptance/regression evidence.
    acceptance: end-to-end acceptance workflow.
    reliability: fault recovery, retention, and long-run reliability.
    performance: resource, throughput, and large-data behavior.
    scientific_validation: field-data and scientific-result validation.
    property: property/fuzz-oriented input-contract tests.
    static_contract: source/configuration architecture contract.
    backend: backend facade and application-service contracts.
    security: security and unsafe-input rejection.
    benchmark: benchmark registry and repeatable performance evidence.
    configuration: settings, profiles, and configuration contracts.
    legacy_regression: retained historical regression coverage awaiting domain migration.
    requirement(ids): requirement identifiers covered by a test.
    risk(ids): risk identifiers mitigated by a test.
    level(name): test level classification.
    external_data: test requires immutable external acceptance data.
addopts = -ra --strict-markers
xfail_strict = true
testpaths = tests
